plugins {
	// 26.1 起 Minecraft 已不再混淆，用的是不带 -remap 后缀的 loom。
	// 混淆版本（<= 1.21.11）才需要 'net.fabricmc.fabric-loom-remap' + mappings 依赖。
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom 会自动加上 Minecraft 与 Fabric 的仓库，这里留给其它模组依赖。
}

dependencies {
	// 26.2 是未混淆版本，因此没有 mappings 这一行。
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// 未混淆版本下依赖用 implementation，而不是 modImplementation。
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib（骨骼动画）从本地 libs\ 引入：刀的模型/动画由 Blockbench 的 GeckoLib
	// 格式导出，游戏内播放需要它。文件同时也放在 PCL 的 mods 目录里。
	implementation files('libs/geckolib-fabric-26.3-5.5.6.jar')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// 源码里有中文注释与字符串，本机默认编码是 GBK，不显式指定会导致乱码。
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// 让发布的 jar 里也带上许可证
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// 访问拓宽：26.2 把 MenuScreens 的注册方法收成了包私有，自定义容器菜单要靠它打开。
// fabric.mod.json 里的 accessWidener 字段负责运行时，这里显式声明一份给 Loom（编译期与开发环境）。
loom {
	accessWidenerPath = file("src/main/resources/sephiria_fantasy.accesswidener")
}
