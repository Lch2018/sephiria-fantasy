plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}
repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation files('libs/geckolib-fabric-1.20.1-4.8.4.jar')
	modCompileOnly files('libs/modmenu-7.2.2.jar')
	// 可选兼容：ToroHealth-Continued 1.5.1（1.20.1）。只编译期引用；运行时靠 required:false 的
	// mixin 配置兜底，没装 ToroHealth 时目标类缺失只会跳过，不炸游戏。
	modCompileOnly files('libs/torohealth-continued-fabric-1.20-1.5.1.jar')
	// ToroHealth 把 cloth-config 以 JiJ 内嵌在 META-INF/jars 里；编译 HUD mixin 时要解析
	// ModConfig 的父接口 ConfigData，所以把 cloth-config 也放到编译类路径（不参与打包）。
	compileOnly files('libs/cloth-config-11.1.136-fabric.jar')
}
processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '2000']
}
java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") { rename { "${it}_$projectName" } }
}
tasks.named('test') { failOnNoDiscoveredTests = false }

loom {
	accessWidenerPath = file('src/main/resources/sephiria_fantasy.accesswidener')
}
