# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# 26.2 需要 Java 25 编译（options.release = 25），所以 Gradle 本身必须跑在 JDK 25 上。
# 本机默认 java 是 21，这里显式指定。换机器/CI 时删掉本行并设置 JAVA_HOME 即可。
org.gradle.java.home=D:/Program Files/Java/jdk-25

# Fabric Properties
# check these on https://fabricmc.net/develop
# 26.1 起 Minecraft 不再混淆，因此没有 yarn_mappings 这一项。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
# 版本号用日期：0.1.<月>.<日>-a（-a = A 测）——每次「发布」前改成当天的日期，
# jar 名、构建与实装脚本都跟着它走，见 AGENTS.md 的版本管理一节。
version=0.1.10.9-a
group=com.sephiria

# Dependencies
fabric_api_version=0.161.0+26.3
